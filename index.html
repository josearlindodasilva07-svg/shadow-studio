<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#101114">
  <meta name="description" content="Shadow Studio — editor de interfaces Roblox pelo navegador.">

  <title>Shadow Studio</title>

  <!-- Arquivo de estilos -->
  <link rel="stylesheet" href="style.css">

  <!-- Arquivo de funcionalidades -->
  <script src="app.js" defer></script>
</head>

<body>

  <!-- CABEÇALHO -->
  <header>
    <div class="logo">
      <span>SHADOW</span> STUDIO
    </div>

    <div class="actions">
      <button id="themeBtn">Tema</button>
      <button id="saveBtn">Salvar</button>
      <button id="loadBtn">Carregar</button>
      <button id="exportBtn" class="primary">Gui2Lua</button>
      <button id="modifyBtn">Modificar GUI</button>
    </div>
  </header>

  <!-- ÁREA PRINCIPAL -->
  <main>

    <!-- EXPLORER -->
    <section class="panel">

      <div class="panel-title">
        <span>Explorer</span>
        <button id="addBtn" title="Adicionar elemento">+</button>
      </div>

      <div class="panel-content explorer" id="tree">
        <!-- O app.js cria os elementos aqui -->
      </div>

      <div class="panel-content">
        <button id="duplicateBtn">Duplicar</button>
        <button id="deleteBtn" class="danger">Apagar</button>
      </div>

    </section>

    <!-- EDITOR CENTRAL -->
    <section class="center">

      <div class="toolbar">
        <button data-add="Frame">+ Frame</button>
        <button data-add="TextLabel">+ Texto</button>
        <button data-add="TextButton">+ Botão</button>
        <button data-add="TextBox">+ Caixa de texto</button>
        <button data-add="ImageLabel">+ Imagem</button>
        <button id="frontBtn">Trazer à frente</button>
      </div>

      <!-- PRÉVIA DA GUI -->
      <div class="preview-area">

        <div id="stage">
          <div class="stage-label">
            SHADOW STUDIO PREVIEW
          </div>
        </div>

      </div>

      <!-- STATUS -->
      <div class="status" id="status">
        Iniciando Shadow Studio...
      </div>

    </section>

    <!-- PROPRIEDADES -->
    <section class="panel right">

      <div class="panel-title">
        Propriedades
      </div>

      <div class="panel-content" id="props">
        <p class="hint">
          Selecione um elemento no Explorer para editar suas propriedades.
        </p>
      </div>

    </section>

  </main>

  <!-- JANELA DE CÓDIGO -->
  <div class="modal" id="modal">

    <div class="dialog">

      <div class="dialog-header">
        <strong id="modalTitle">Editor de código</strong>
        <button id="closeModal">Fechar</button>
      </div>

      <textarea
        id="codeArea"
        spellcheck="false"
        autocapitalize="off"
        autocomplete="off"
        placeholder="O código aparecerá aqui..."
      ></textarea>

      <div class="dialog-footer">
        <button id="copyBtn">Copiar código</button>
        <button id="applyBtn" class="primary">
          Aplicar modificações
        </button>
      </div>

    </div>

  </div>

</body>
</html>
